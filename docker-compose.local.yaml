services:
  redis:
    image: redis:7-alpine
    container_name: prowjack-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - prowjack-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowjack-prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    networks:
      - prowjack-net

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: prowjack-torrserver
    restart: unless-stopped
    volumes:
      - torrserver-data:/opt/ts
    ports:
      - "8092:8090"
    networks:
      - prowjack-net

  prowjack:
    build: .
    container_name: prowjack-app
    restart: unless-stopped
    depends_on:
      - redis
      - prowlarr
      - torrserver
    env_file:
      - .env.local-stack
    volumes:
      - prowjack-data:/data
    ports:
      - "7015:7860"
    networks:
      - prowjack-net

networks:
  prowjack-net:
    driver: bridge

volumes:
  redis-data:
  prowlarr-config:
  prowjack-data:
  torrserver-data:
