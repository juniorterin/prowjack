<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente azul fundo estilo Netscape -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a3a8c"/>
      <stop offset="100%" stop-color="#0a1a5c"/>
    </linearGradient>
    <!-- Gradiente branco-azul da letra T -->
    <linearGradient id="t-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#c8d8ff"/>
      <stop offset="100%" stop-color="#8aaaf0"/>
    </linearGradient>
    <!-- Gradiente do meteoro laranja -->
    <linearGradient id="meteor-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ffcc44" stop-opacity="0.8"/>
      <stop offset="60%"  stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo azul escuro com bordas arredondadas (ícone quadrado) -->
  <rect width="64" height="64" rx="6" fill="url(#bg-grad)"/>

  <!-- Estrelas de fundo -->
  <circle cx="8"  cy="10" r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="18" cy="5"  r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="50" cy="8"  r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="58" cy="18" r="0.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="56" cy="4"  r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="6"  cy="50" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="12" cy="30" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="55" cy="50" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="42" cy="57" r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="28" cy="58" r="0.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="38" cy="14" r="0.6" fill="#ffffff" opacity="0.5"/>

  <!-- Letra T — estilo Netscape (bold, limpa) -->
  <!-- Barra horizontal do T -->
  <rect x="11" y="14" width="42" height="10" rx="1" fill="url(#t-grad)"/>
  <!-- Haste vertical do T -->
  <rect x="27" y="24" width="10" height="28" rx="1" fill="url(#t-grad)"/>

  <!-- Meteoro passando diagonalmente (canto sup-dir → inf-esq), estilo Netscape -->
  <line x1="62" y1="4" x2="14" y2="52" stroke="url(#meteor-grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Núcleo brilhante do meteoro -->
  <circle cx="46" cy="20" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="46" cy="20" r="1.2" fill="#ffdd88"/>
  <!-- Cauda menor -->
  <line x1="62" y1="4" x2="50" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
