<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
  <defs>
    <clipPath id="sq"><rect x="46" y="46" width="420" height="420" rx="10"/></clipPath>
  </defs>

  <!-- ── fragmento de cartaz — quadrado levemente girado, como um recorte colado -->
  <g transform="rotate(-4 256 256)">
    <rect x="42" y="42" width="428" height="428" rx="10" fill="#241c14"/>
    <rect x="46" y="46" width="420" height="420" rx="10" fill="#e9dfc7"/>

    <g clip-path="url(#sq)">
      <!-- raios, irrompendo do canto inferior-esquerdo -->
      <path d="M72,452 L-49.6,-237.4 L85.6,-247.9 Z" fill="#c9973f"/>
      <path d="M72,452 L220.2,-232.1 L349.3,-190.8 Z" fill="#c9973f"/>
      <path d="M72,452 L467.9,-125.3 L571.8,-38.2 Z" fill="#c9973f"/>
      <path d="M72,452 L656.8,67.3 L720.0,187.3 Z" fill="#c9973f"/>
      <path d="M72,452 L758.9,317.1 L772.0,452.0 Z" fill="#c9973f"/>

      <!-- bobina/olho — anel em petróleo desbotado, girado, como uma lente de cinema -->
      <g transform="rotate(3 256 246)">
        <circle cx="256" cy="246" r="146" fill="none" stroke="#3c6e6a" stroke-width="34"/>
        <circle cx="256" cy="246" r="60" fill="#e9dfc7" stroke="#241c14" stroke-width="5"/>
        <circle cx="256" cy="246" r="22" fill="#241c14"/>
      </g>

      <!-- cunha vermelha atravessando — referência direta à "Beat the Whites with the Red Wedge" -->
      <polygon points="-20,300 300,-20 400,60 60,400" fill="#a8352a"/>

      <!-- sombra de dobra, canto inferior direito -->
      <polygon points="466,466 466,392 392,466" fill="#241c14" opacity="0.14"/>
    </g>

    <rect x="46" y="46" width="420" height="420" rx="10" fill="none" stroke="#241c14" stroke-width="7"/>
  </g>

  <!-- ── selo colado — tira de estêncil com o T, num ângulo próprio -->
  <g transform="rotate(-9 372 378)">
    <rect x="300" y="340" width="150" height="76" fill="#241c14"/>
    <rect x="300" y="340" width="150" height="76" fill="none" stroke="#e9dfc7" stroke-width="3"/>
    <text x="375" y="394" font-family="Oswald, Arial, sans-serif" font-weight="700" font-size="52" fill="#e9dfc7" text-anchor="middle">T</text>
  </g>
</svg>
