<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorrStremio · Admin</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --page: #0d0c14; --surface: #16141f; --surface-2: #1e1b2c; --surface-3: #262239;
    --ink: #f4f2fa; --ink-2: #b3aec9; --muted: #756f8f;
    --border: rgba(244,242,250,0.09); --border-2: rgba(244,242,250,0.16);
    --accent: #e8a33d; --accent-ink: #1a1206; --accent-soft: rgba(232,163,61,0.14);
    --brand: #8b7ff0; --brand-soft: rgba(139,127,240,0.16);
    --good: #4cc38a; --good-soft: rgba(76,195,138,0.14);
    --bad: #e0607a; --bad-soft: rgba(224,96,122,0.14);
    --font-display: 'Sora', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --page: #f7f6fb; --surface: #ffffff; --surface-2: #f1eef8; --surface-3: #e7e2f5;
      --ink: #18151f; --ink-2: #524c68; --muted: #8b84a3;
      --border: rgba(24,21,31,0.09); --border-2: rgba(24,21,31,0.16);
      --accent: #b9791b; --accent-ink: #ffffff; --accent-soft: rgba(185,121,27,0.12);
      --brand: #6a5ce0; --brand-soft: rgba(106,92,224,0.12);
      --good: #1f8a5c; --good-soft: rgba(31,138,92,0.12);
      --bad: #c23158; --bad-soft: rgba(194,49,88,0.12);
      --shadow: 0 20px 50px -24px rgba(24,21,31,0.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; min-height: 100vh; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  code, .mono { font-family: var(--font-mono); }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; font-size: inherit; color: var(--ink); }

  .shell { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(155deg, var(--brand), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; color: #100c1e; font-size: 15px;
  }
  .brand b { font-family: var(--font-display); font-size: 15px; }
  .brand span { display: block; font-size: 11px; color: var(--muted); }
  .btn-ghost { background: var(--surface-2); border: 1px solid var(--border-2); color: var(--ink-2); border-radius: 9px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; }
  .btn-ghost:hover { color: var(--ink); border-color: var(--brand); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .card-head h2 { font-size: 16px; }
  .card-head p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }

  .new-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .new-row input { flex: 1; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 9px; padding: 9px 12px; outline: none; }
  .new-row input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 9px; padding: 9px 18px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: .6; cursor: wait; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 0 10px 10px; }
  td { padding: 11px 10px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:hover td { background: var(--surface-2); }
  .kv { font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .kv .icon-btn { background: none; border: none; color: var(--muted); padding: 2px; display: flex; }
  .kv .icon-btn:hover { color: var(--brand); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .pill.locked { background: var(--good-soft); color: var(--good); }
  .pill.open { background: var(--surface-3); color: var(--muted); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .row-actions button { background: none; border: 1px solid var(--border-2); color: var(--ink-2); border-radius: 7px; padding: 5px 10px; font-size: 11.5px; font-weight: 600; }
  .row-actions button:hover { border-color: var(--brand); color: var(--brand); }
  .row-actions button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-3); border: 1px solid var(--border-2); color: var(--ink);
    padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div><b>TorrStremio Admin</b><span>Chaves de acesso</span></div>
    </div>
    <button class="btn-ghost" id="logout-btn">Sair</button>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <h2>Chaves de acesso</h2>
        <p>Cada chave trava automaticamente no primeiro IP que a usar. Sem chave válida, a pessoa só vê o catálogo.</p>
      </div>
    </div>
    <div class="new-row">
      <input type="text" id="new-label" placeholder="Rótulo (ex: nome da pessoa)" maxlength="80">
      <button class="btn-primary" id="new-btn">+ Nova chave</button>
    </div>
    <table>
      <thead>
        <tr><th>Rótulo</th><th>Chave</th><th>IP</th><th>Criada em</th><th></th></tr>
      </thead>
      <tbody id="keys-body"></tbody>
    </table>
    <div class="empty" id="keys-empty" style="display:none">Nenhuma chave criada ainda.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg, isErr) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 3000);
}
function fmtDate(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

async function api(path, opts) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts }).then(r => r.json());
  if (!res.ok) throw new Error(res.error || "Falha na requisição");
  return res;
}

async function loadKeys() {
  const { keys } = await api("/admin/api/keys");
  const body = document.getElementById("keys-body");
  document.getElementById("keys-empty").style.display = keys.length ? "none" : "block";
  body.innerHTML = "";
  for (const k of keys) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${k.label || "—"}</td>
      <td><span class="kv"><span>${k.id}</span><button class="icon-btn" data-copy="${k.id}" title="Copiar">📋</button></span></td>
      <td>${k.ip ? `<span class="pill locked">🔒 ${k.ip}</span>` : `<span class="pill open">aberta</span>`}</td>
      <td>${fmtDate(k.createdAt)}</td>
      <td>
        <div class="row-actions">
          <button data-reset="${k.id}" ${k.ip ? "" : "disabled"}>Resetar IP</button>
          <button data-del="${k.id}" class="danger">Excluir</button>
        </div>
      </td>
    `;
    body.appendChild(tr);
  }
}

document.getElementById("new-btn").addEventListener("click", async () => {
  const input = document.getElementById("new-label");
  const label = input.value.trim();
  if (!label) return toast("Digite um rótulo", true);
  const btn = document.getElementById("new-btn");
  btn.disabled = true;
  try {
    await api("/admin/api/keys", { method: "POST", body: JSON.stringify({ label }) });
    input.value = "";
    await loadKeys();
    toast("Chave criada");
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
  }
});
document.getElementById("new-label").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("new-btn").click();
});

document.getElementById("keys-body").addEventListener("click", async (e) => {
  const copyId = e.target.closest("[data-copy]")?.dataset.copy;
  if (copyId) { navigator.clipboard.writeText(copyId).then(() => toast("Chave copiada")); return; }

  const resetId = e.target.closest("[data-reset]")?.dataset.reset;
  if (resetId) {
    try { await api(`/admin/api/keys/${resetId}/reset-ip`, { method: "POST" }); await loadKeys(); toast("IP resetado"); }
    catch (err) { toast(err.message, true); }
    return;
  }

  const delId = e.target.closest("[data-del]")?.dataset.del;
  if (delId) {
    if (!confirm("Excluir essa chave? A pessoa perde o acesso imediatamente.")) return;
    try { await api(`/admin/api/keys/${delId}`, { method: "DELETE" }); await loadKeys(); toast("Chave excluída"); }
    catch (err) { toast(err.message, true); }
  }
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await fetch("/admin/logout", { method: "POST" });
  location.href = "/admin/login";
});

loadKeys().catch(err => toast(err.message, true));
</script>
</body>
</html>
