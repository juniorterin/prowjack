<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorrESMIN · Admin</title>
<link rel="icon" href="/logo.svg">
<style>
/* ═══════════════════════════════════════════════
   WINDOWS 95 AUTHENTIC THEME — admin-login
   ═══════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #008080; /* Win95 teal desktop */
  color: #000000;
  font-family: "MS Sans Serif", "Microsoft Sans Serif", Arial, sans-serif;
  font-size: 11px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1 {
  font-family: "MS Sans Serif", "Microsoft Sans Serif", Arial, sans-serif;
  color: #000000; margin: 0 0 6px; font-size: 13px; font-weight: bold;
}
a { color: #000080; }
p { color: #000000; margin: 0; font-size: 11px; }
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.blink { animation: blink 1s step-start infinite; }

.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 20px;
}
.gifs-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-bottom: 12px;
}

/* Janela Win95 */
.card {
  background: #c0c0c0;
  border: 2px solid #000000;
  box-shadow:
    inset 1px 1px 0 #ffffff,
    inset -1px -1px 0 #808080,
    3px 3px 0 #000000;
  padding: 2px;
  width: 100%;
  max-width: 340px;
  text-align: left;
}

/* Title bar */
.card-titlebar {
  background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
  color: #ffffff;
  font-family: "MS Sans Serif", Arial, sans-serif;
  font-size: 11px; font-weight: bold;
  padding: 3px 6px;
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 0;
  user-select: none;
}
.card-titlebar .win-btns {
  margin-left: auto;
  display: flex;
  gap: 2px;
}
.card-titlebar .win-btn {
  width: 16px; height: 14px;
  background: #c0c0c0;
  border-top: 1px solid #ffffff;
  border-left: 1px solid #ffffff;
  border-bottom: 1px solid #404040;
  border-right: 1px solid #404040;
  box-shadow: inset 1px 1px 0 #dfdfdf;
  font-size: 9px; line-height: 13px; text-align: center;
  color: #000000; cursor: default;
  font-family: "MS Sans Serif", Arial;
}
.card-titlebar .win-btn:active {
  border-top: 1px solid #404040; border-left: 1px solid #404040;
  border-bottom: 1px solid #ffffff; border-right: 1px solid #ffffff;
  box-shadow: none;
}

/* Card body (client area) */
.card-body-inner {
  padding: 16px 20px 20px;
  background: #c0c0c0;
  text-align: center;
}

.brand-mark { display: none; }
.sub {
  color: #404040;
  font-size: 11px;
  margin: 0 0 14px;
  font-family: "MS Sans Serif", Arial;
}
label {
  display: block;
  text-align: left;
  font-size: 11px;
  font-weight: bold;
  color: #000000;
  margin-bottom: 4px;
  font-family: "MS Sans Serif", Arial;
}
input[type="password"] {
  width: 100%;
  display: block;
  background: #ffffff;
  color: #000000;
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-bottom: 2px solid #dfdfdf;
  border-right: 2px solid #dfdfdf;
  box-shadow: inset 1px 1px 0 #404040;
  font-family: "MS Sans Serif", Arial, sans-serif;
  padding: 4px 6px;
  font-size: 11px;
  margin-bottom: 14px;
  outline: none;
}
input[type="password"]:focus {
  outline: 1px dotted #000000;
  outline-offset: -2px;
}

/* Submit button — default button with thick border */
button[type="submit"] {
  width: 100%;
  padding: 4px 12px;
  font-size: 11px; font-weight: bold;
  background: #c0c0c0;
  color: #000000;
  font-family: "MS Sans Serif", Arial, sans-serif;
  border: 2px solid #000000;
  box-shadow:
    inset 1px 1px 0 #ffffff,
    inset -1px -1px 0 #808080,
    1px 1px 0 #404040;
  cursor: pointer;
  min-height: 23px;
  outline: none;
}
button[type="submit"]:hover { background: #d4d0c8; }
button[type="submit"]:focus {
  outline: 1px dotted #000000;
  outline-offset: -5px;
}
button[type="submit"]:active {
  box-shadow:
    inset 1px 1px 0 #808080,
    inset -1px -1px 0 #dfdfdf,
    1px 1px 0 #404040;
  padding-top: 5px;
  padding-left: 13px;
}
button[type="submit"]:disabled {
  color: #808080;
  cursor: default;
  box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080, 1px 1px 0 #404040;
}

.error {
  color: #800000;
  font-size: 11px;
  margin-top: 8px;
  display: none;
  font-weight: bold;
  font-family: "MS Sans Serif", Arial;
}
.error.show { display: block; }

/* Status bar / footer */
.footer-bar {
  text-align: center;
  padding: 4px 12px;
  color: #000000;
  font-family: "MS Sans Serif", Arial, sans-serif;
  font-size: 11px;
  border-top: 2px solid #808080;
  border-bottom: 1px solid #ffffff;
  background: #c0c0c0;
  margin-top: auto;
}
</style>
</head>
<body>

<marquee behavior="scroll" direction="left" scrollamount="5" style="background:#000080;color:#ffff00;font-family:'Comic Sans MS',Verdana;font-weight:bold;font-size:16px;padding:6px 0;border-top:3px ridge #ffffff;border-bottom:3px ridge #808080;">&#9733; BEM-VINDO AO TORRESMIN &#9733; O MELHOR CATÁLOGO DE TORRENTS &#9733; STREAMING DE QUALIDADE DESDE 1997 &#9733; ÁREA RESTRITA &#9733;</marquee>

<div class="login-wrapper">

  <div class="gifs-row">
    <img src="https://web.archive.org/web/20090830050558/http://www.geocities.com/Heartland/Estates/1328/images/film.gif" alt="" width="40" height="40" onerror="this.style.display='none'">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="/logo.svg" alt="TorrESMIN" width="64" height="64" style="image-rendering:pixelated;">
      <span style="font-family:'Comic Sans MS',Verdana;font-size:36px;font-weight:900;color:#000080;text-shadow:2px 2px #ffffff,3px 3px #808080;">TorrESMIN</span>
    </div>
    <img src="https://web.archive.org/web/20090830050558/http://www.geocities.com/Heartland/Estates/1328/images/film.gif" alt="" width="40" height="40" onerror="this.style.display='none'">
  </div>

  <!-- Animação de bolinhas coloridas -->
  <div style="text-align:center;margin-bottom:14px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="24">
      <circle cx="20" cy="12" r="5" fill="#ff0000"><animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="12" r="5" fill="#ff8800"><animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.1s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="12" r="5" fill="#ffff00"><animate attributeName="opacity" values="1;0;1" dur="0.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="110" cy="12" r="5" fill="#00cc00"><animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="12" r="5" fill="#0000ff"><animate attributeName="opacity" values="1;0;1" dur="0.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="12" r="5" fill="#cc00cc"><animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    </svg>
  </div>

  <form class="card" id="login-form">
    <div class="card-titlebar">
      🔐 TorrESMIN Admin
      <div class="win-btns">
        <div class="win-btn">_</div>
        <div class="win-btn">□</div>
        <div class="win-btn">✕</div>
      </div>
    </div>
    <div class="card-body-inner">
      <img class="brand-mark" src="/logo.svg" alt="TorrESMIN">
      <h1 style="font-size:13px;text-align:center;margin-bottom:4px;">Admin</h1>
      <p class="sub">TorrESMIN — área restrita</p>
      <label for="password">Senha:</label>
      <input type="password" id="password" autofocus autocomplete="current-password">
      <button type="submit" id="submit-btn">Entrar</button>
      <div class="error" id="error"></div>
    </div>
  </form>

  <div style="text-align:center;margin-top:14px;">
    <img src="https://web.archive.org/web/20091021165527/http://geocities.com/Area51/Labyrinth/7730/line.gif" alt="" width="300" height="10" onerror="this.style.display='none'">
  </div>

</div>

<div class="footer-bar">
  <div>
    <img src="https://web.archive.org/web/20091021165527/http://geocities.com/Area51/Labyrinth/7730/star.gif" alt="★" width="16" height="16" onerror="this.replaceWith('★')">
    TorrESMIN
    <img src="https://web.archive.org/web/20091021165527/http://geocities.com/Area51/Labyrinth/7730/star.gif" alt="★" width="16" height="16" onerror="this.replaceWith('★')">
  </div>
  <div>Melhor visto em <b>Netscape Navigator 4.0</b> · Resolução <b>800x600</b></div>
  <div style="margin-top:6px;">Visitantes: <span style="color:#cc0000;font-weight:bold;font-size:16px;" class="blink">001337</span></div>
  <div style="margin-top:4px;color:#666;">© 1997–2025 TorrESMIN</div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const err = document.getElementById("error");
  err.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try {
    const res = await fetch("/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    }).then(r => r.json());
    if (!res.ok) throw new Error(res.error || "Falha no login");
    location.href = "/admin";
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
    btn.disabled = false;
    btn.textContent = "Entrar ▶";
  }
});
</script>
</body>
</html>
