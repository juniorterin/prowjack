<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorrStremio · Admin</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --page: #170e0c; --surface: #221512; --surface-2: #2c1a16;
    --ink: #f6ece6; --ink-2: #cbaea5; --muted: #8c6b62;
    --border: rgba(246,236,230,0.09); --border-2: rgba(246,236,230,0.16);
    --accent: #dda23f; --accent-ink: #1c1206;
    --brand: #b7392b; --brand-soft: rgba(183,57,43,0.18);
    --bad: #e2506b; --bad-soft: rgba(226,80,107,0.14);
    --font-display: 'Sora', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --page: #faf3ee; --surface: #ffffff; --surface-2: #f5e7df;
      --ink: #241511; --ink-2: #6b4c42; --muted: #9c7c70;
      --border: rgba(36,21,17,0.09); --border-2: rgba(36,21,17,0.16);
      --accent: #a97620; --accent-ink: #ffffff;
      --brand: #9c2e22; --brand-soft: rgba(156,46,34,0.12);
      --bad: #c2355a; --bad-soft: rgba(194,53,90,0.12);
      --shadow: 0 20px 50px -24px rgba(24,21,31,0.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border-2); border-radius: 18px;
    padding: 32px; width: 100%; max-width: 340px; box-shadow: var(--shadow);
  }
  .brand-mark { width: 40px; height: 40px; border-radius: 50%; display: block; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: 19px; margin: 0 0 4px; }
  p.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 7px; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border-2); color: var(--ink);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  button {
    width: 100%; margin-top: 18px; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 10px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin-top: 14px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <img class="brand-mark" src="/logo.svg" alt="TorrStremio">
    <h1>Admin</h1>
    <p class="sub">TorrStremio — área restrita</p>
    <label for="password">Senha</label>
    <input type="password" id="password" autofocus autocomplete="current-password">
    <button type="submit" id="submit-btn">Entrar</button>
    <div class="error" id="error"></div>
  </form>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const err = document.getElementById("error");
  err.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try {
    const res = await fetch("/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    }).then(r => r.json());
    if (!res.ok) throw new Error(res.error || "Falha no login");
    location.href = "/admin";
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
