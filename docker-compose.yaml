services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis-data:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - prowlarr-config:/config

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    restart: unless-stopped
    volumes:
      - torrserver-data:/opt/ts
    mem_limit: 4g
    ports:
      - "6881:6881"
      - "6881:6881/udp"

  prowjack:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
      - prowlarr
      - torrserver
    environment:
      - JACKETT_URL=http://prowlarr:9696
      - JACKETT_API_KEY=${JACKETT_API_KEY}
      - REDIS_URL=redis://redis:6379
      - CONFIG_DATA_DIR=/data
      - PORT=7860
      - ADDON_PUBLIC_URL=${ADDON_PUBLIC_URL}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - ENABLE_PURE_P2P=false
      - TS_URL=http://torrserver:8090
      - TS_PUBLIC_URL=${TS_PUBLIC_URL}
      - TS_USER=
      - TS_PASS=
      - QB_EXTRA_SLOTS=100
    volumes:
      - prowjack-data:/data

volumes:
  redis-data:
  prowlarr-config:
  torrserver-data:
  prowjack-data:
